name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Test default provider switching
        shell: bash
        run: sudo -E bash tests/test-provider-config.sh
      - name: Test command panel
        shell: bash
        run: printf '2\n0\n' | bash panel.sh
      - name: Test global command launcher
        shell: bash
        run: bash tests/test-command-launcher.sh
      - name: Test ChatGPT login status detection
        shell: bash
        run: bash tests/test-login-status.sh
      - name: Test API key validation
        shell: bash
        run: bash tests/test-api-key-validation.sh
      - name: Test systemd unit generation
        shell: bash
        run: bash tests/test-systemd-units.sh
      - name: Test unit refresh transaction rollback
        shell: bash
        run: sudo -E bash tests/test-refresh-units-transaction.sh
      - name: Install Codex CLI for continuity validation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          test -x "$HOME/.local/bin/codex"
      - name: Test stable session provider routing
        shell: bash
        run: |
          CODEX_BIN="$HOME/.local/bin/codex" \
            CODEX_RP_REQUIRE_CONTINUITY_TEST=yes \
            bash tests/test-session-continuity.sh
      - name: Test legacy session provider upgrade
        shell: bash
        run: sudo -E bash tests/test-legacy-session-upgrade.sh
      - name: Test provider installation transaction
        shell: bash
        run: sudo -E bash tests/test-install-provider.sh
      - name: Test mode switching and rollback lifecycle
        shell: bash
        run: sudo -E bash tests/test-lifecycle.sh
      - name: Test provider reconfiguration and key rotation
        shell: bash
        run: sudo -E bash tests/test-reconfigure.sh
      - name: Test macOS configuration lifecycle
        shell: bash
        run: bash tests/test-macos-platform.sh
      - name: Test online installer
        shell: bash
        run: bash tests/test-online-installer.sh
      - name: Reject likely committed credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}|[A-Za-z_][A-Za-z0-9_]*_API_KEY[[:space:]]*=[[:space:]]*"?[A-Za-z0-9._~+/=-]{20,}"?)'
          fixture_token=$(printf 'A%.0s' {1..24})
          if ! printf 'THIRD_PARTY_API_KEY=%s\n' "$fixture_token" | grep -qE "$pattern"; then
            echo 'Credential scanner self-test failed for an unquoted API key.' >&2
            exit 1
          fi
          if ! printf 'CODEX_RP_FIXTURE_API_KEY="%s"\n' "$fixture_token" | grep -qE "$pattern"; then
            echo 'Credential scanner self-test failed for a quoted dynamic API key.' >&2
            exit 1
          fi
          if grep -RIlE --exclude-dir=.git "$pattern" . >&2; then
            echo 'Potential credential found. Rotate it and remove it from Git history.' >&2
            exit 1
          fi

  windows-platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate PowerShell syntax (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test Windows configuration lifecycle
        shell: powershell
        run: ./tests/test-windows-platform.ps1
      - name: Test Windows online installer
        shell: powershell
        run: ./tests/test-windows-installer.ps1
