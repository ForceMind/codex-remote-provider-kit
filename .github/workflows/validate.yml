name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Test default provider switching
        shell: bash
        run: bash tests/test-provider-config.sh
      - name: Test command panel
        shell: bash
        run: printf '2\n0\n' | bash panel.sh
      - name: Test global command launcher
        shell: bash
        run: bash tests/test-command-launcher.sh
      - name: Test ChatGPT login status detection
        shell: bash
        run: bash tests/test-login-status.sh
      - name: Test API key validation
        shell: bash
        run: bash tests/test-api-key-validation.sh
      - name: Test systemd unit generation
        shell: bash
        run: bash tests/test-systemd-units.sh
      - name: Test provider installation transaction
        shell: bash
        run: sudo -E bash tests/test-install-provider.sh
      - name: Test mode switching and rollback lifecycle
        shell: bash
        run: sudo -E bash tests/test-lifecycle.sh
      - name: Test provider reconfiguration and key rotation
        shell: bash
        run: sudo -E bash tests/test-reconfigure.sh
      - name: Test online installer
        shell: bash
        run: bash tests/test-online-installer.sh
      - name: Test automatic updater
        shell: bash
        run: bash tests/test-auto-update.sh
      - name: Reject likely committed credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/-]{20,}|THIRD_PARTY_API_KEY=[A-Za-z0-9._~+/-]{20,})'
          if grep -RInE --exclude-dir=.git "$pattern" .; then
            echo 'Potential credential found. Rotate it and remove it from Git history.' >&2
            exit 1
          fi

  windows-platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate PowerShell syntax (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test Windows configuration lifecycle
        shell: powershell
        run: ./tests/test-windows-platform.ps1
      - name: Test Windows online installer
        shell: powershell
        run: ./tests/test-windows-installer.ps1

  macos-platform:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts with macOS system Bash
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            /bin/bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Test macOS configuration lifecycle
        shell: bash
        run: /bin/bash tests/test-macos-platform.sh
      - name: Test macOS online installer
        shell: bash
        run: /bin/bash tests/test-online-installer.sh
