name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Reject likely committed credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/-]{20,}|INNO_FLARE_API_KEY=[A-Za-z0-9._~+/-]{20,})'
          if grep -RInE --exclude-dir=.git "$pattern" .; then
            echo 'Potential credential found. Rotate it and remove it from Git history.' >&2
            exit 1
          fi
